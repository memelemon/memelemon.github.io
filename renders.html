<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Selected 3D renders and digital imagery by meme_lemon.">
    <meta name="author" content="meme_lemon">
    <title>Renders — meme_lemon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="portfolio.css">
    <link rel="stylesheet" href="renders-gallery.css">
</head>
<body>
    <div class="page">
        <header class="site-header">
            <a class="logo" href="index.html">meme_lemon</a>
            <a class="back-link" href="portfolio.html">← PORTFOLIO</a>
        </header>

        <main>
            <section class="intro intro--category">
                <p class="eyebrow">01 / SELECTED WORKS</p>
                <h1 class="page-title">RENDERS</h1>
                <p class="intro-description">Selected 3D renders and digital imagery.</p>
            </section>

            <section class="collection">
                <div class="section-heading">
                    <h2>ARTWORKS</h2>
                    <span>3D / DIGITAL</span>
                </div>
                <div id="renders-field" class="renders-field" aria-label="Artwork collection"></div>
                <p id="render-status" class="render-status" aria-live="polite">LOADING WORKS...</p>
            </section>
        </main>

        <footer class="site-footer">
            <span>meme_lemon © 2026</span>
            <a href="socials.html">SOCIALS</a>
            <a href="portfolio.html">PORTFOLIO</a>
        </footer>
    </div>

    <div id="render-lightbox" class="render-lightbox" role="dialog" aria-modal="true" aria-label="Artwork viewer" aria-hidden="true">
        <div class="lightbox-top">
            <span id="lightbox-title">ARTWORK</span>
            <div class="lightbox-controls">
                <button id="lightbox-prev" class="lightbox-button" type="button" aria-label="Previous artwork">←</button>
                <button id="lightbox-next" class="lightbox-button" type="button" aria-label="Next artwork">→</button>
                <button id="lightbox-close" class="lightbox-button" type="button" aria-label="Close viewer">×</button>
            </div>
        </div>
        <div class="lightbox-stage">
            <img id="lightbox-image" class="lightbox-image" src="" alt="">
        </div>
        <div class="lightbox-bottom">
            <span id="lightbox-counter">01 / 01</span>
            <span class="lightbox-hint">ESC TO CLOSE · ← → TO NAVIGATE</span>
        </div>
    </div>
    <script src="renders-gallery.js"></script>
</body>
</html>
